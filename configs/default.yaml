# KitAI Default Model Configuration
# Optimized for consumer GPUs (6GB VRAM)

model:
  # Vocabulary
  vocab_size: 32000

  # Model dimensions
  d_model: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 4  # Grouped Query Attention ratio: 12/4 = 3 queries per KV
  d_ff: 2048  # SwiGLU hidden dimension (~8/3 * d_model)
  max_seq_len: 2048

  # Regularization
  dropout: 0.0
  norm_eps: 1e-6

  # Positional embeddings (RoPE)
  rope_theta: 10000.0

  # Architecture options
  activation: swiglu
  weight_tying: true
  bias: false
  init_std: 0.02

  # Memory optimization
  gradient_checkpointing: true
  use_flash_attention: true

training:
  # Batch and optimization
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 100000
  max_epochs: 3

  # Learning rate
  learning_rate: 3e-4
  min_learning_rate: 3e-5
  warmup_steps: 1000
  weight_decay: 0.1

  # Loss
  label_smoothing: 0.0

  # Gradient
  gradient_clip_val: 1.0

  # Mixed precision
  use_amp: true

  # Logging and checkpointing
  log_every_n_steps: 10
  save_every_n_steps: 1000
  validate_every_n_steps: 500
  keep_last_n_checkpoints: 3
  log_dir: logs
  output_dir: checkpoints
  experiment_name: kitai_default

  # Data
  num_workers: 0
  pin_memory: true
