# KitAI Medium Model Configuration
# ~350M parameters - requires careful memory management on 6GB VRAM
# Good balance of quality and resource usage

model:
  vocab_size: 32000
  d_model: 1024
  n_layers: 16
  n_heads: 16
  n_kv_heads: 8
  d_ff: 2730
  max_seq_len: 2048
  dropout: 0.0
  norm_eps: 1e-6
  rope_theta: 10000.0
  activation: swiglu
  weight_tying: true
  bias: false
  init_std: 0.02
  gradient_checkpointing: true
  use_flash_attention: true

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 100000
  max_epochs: 3
  learning_rate: 3e-4
  min_learning_rate: 3e-5
  warmup_steps: 1000
  weight_decay: 0.1
  label_smoothing: 0.0
  gradient_clip_val: 1.0
  use_amp: true
  log_every_n_steps: 10
  save_every_n_steps: 1000
  validate_every_n_steps: 500
  keep_last_n_checkpoints: 3
  log_dir: logs
  output_dir: checkpoints
  experiment_name: kitai_medium
  num_workers: 0
  pin_memory: true
