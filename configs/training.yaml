# KitAI Training-Specific Configuration
# Overrides for training hyperparameters

model:
  # Tiny model for testing training pipeline
  vocab_size: 32000
  d_model: 256
  n_layers: 4
  n_heads: 4
  n_kv_heads: 2
  d_ff: 682
  max_seq_len: 512
  dropout: 0.0
  norm_eps: 1e-6
  rope_theta: 10000.0
  activation: swiglu
  weight_tying: true
  bias: false
  init_std: 0.02
  gradient_checkpointing: true
  use_flash_attention: false

training:
  batch_size: 2
  gradient_accumulation_steps: 2
  max_steps: 100
  learning_rate: 1e-4
  min_learning_rate: 1e-5
  warmup_steps: 10
  weight_decay: 0.1
  gradient_clip_val: 1.0
  use_amp: false  # Disable AMP for tiny testing model
  log_every_n_steps: 1
  save_every_n_steps: 50
  validate_every_n_steps: 25
  log_dir: logs
  output_dir: checkpoints
  experiment_name: kitai_test
  num_workers: 0
  pin_memory: false
